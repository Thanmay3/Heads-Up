# Postgres for HeadsUp. Not required for local dev (SQLite fallback is built in),
# but this is the intended database for persistent application data.
# Start with: docker compose up -d db
services:
  db:
    image: postgres:16
    container_name: headsup-db
    environment:
      POSTGRES_USER: headsup
      POSTGRES_PASSWORD: headsup
      POSTGRES_DB: headsup
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U headsup"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
